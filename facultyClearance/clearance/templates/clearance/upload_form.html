{% extends 'base.html' %}

{% block content %}
  <h3 class="mb-4">
    {% if is_reupload %}Update{% else %}Upload{% endif %} {{ requirement.title }}
  </h3>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">
      {% if is_reupload %}Update File{% else %}Upload File{% endif %}
    </button>
  </form>
{% endblock %}
