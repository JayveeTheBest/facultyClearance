{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Clearance System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body {
      display: flex;
      min-height: 100vh;
      background-color: #f5f5f5;
      margin: 0;
    }
    .sidebar {
      width: 250px;
      background-color: #0a2b50;
      color: white;
      padding: 1rem;
      position: fixed;
      height: 100vh;
    }
    .sidebar .logo img {
      max-width: 50%;
      height: auto;
      margin-bottom: 1rem;
    }
    .sidebar a {
      color: #ffffff;
      display: block;
      padding: 0.5rem 0;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #1b3e66;
      border-radius: 5px;
    }
    .main-content {
      margin-left: 250px;
      padding: 2rem;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo text-center">
      <img src="{% static 'images/ccict-logo.png' %}" alt="CCICT Logo">
      <h5 class="mt-2">CCICT<br>Faculty Clearance</h5>
    </div>
    <hr>
    <nav>
      <a href="{% url 'upload_clearance_document' %}">📤 Upload</a>
      <a href="#">📋 My Documents</a>
      <a href="#">✅ Approvals</a>
      <a href="#">🔓 Logout</a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    {% block content %}
    <!-- Page-specific content will appear here -->
    {% endblock %}
  </div>

</body>
</html>
