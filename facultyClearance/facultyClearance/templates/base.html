{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Faculty Clearance System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">



  <style>
    body {
      display: flex;
      min-height: 100vh;
      background-color: #f5f5f5;
      margin: 0;
    }
    .sidebar {
      width: 250px;
      background-color: #0a2b50;
      color: white;
      padding: 1rem;
      position: fixed;
      height: 100vh;
    }
    .sidebar .logo img {
      max-width: 50%;
      height: auto;
      margin-bottom: 1rem;
    }
    .sidebar a {
      color: #ffffff;
      display: block;
      padding: 0.5rem 0;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #1b3e66;
      border-radius: 5px;
    }
    .main-content {
      margin-left: 250px;
      padding: 2rem;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
<div class="sidebar">
  <div class="logo text-center">
    <a href="{% url 'dashboard' %}">
      <img src="{% static 'images/ccict-logo.png' %}" alt="CCICT Logo">
    </a>
    <h5 class="mt-2">CCICT<br>Faculty Clearance</h5>
  </div>
  <hr>
  <nav>
    <!-- Dashboard -->
    <a href="{% url 'dashboard' %}">
      <i class="fas fa-home me-2"></i>Dashboard
    </a>

    {% elif role == 'chair' or role == 'dean' %}
      <!-- Approvals and Submissions for Chair/Dean -->
      <a href="{% url 'approvals' %}">
        <i class="fas fa-check-circle me-2"></i>Approvals
      </a>
      <a href="{% url 'submissions' %}">
        <i class="fas fa-folder-open me-2"></i>Submissions
      </a>
    {% elif role == 'admin' %}
      <!-- Admin-only links -->
      <a href="{% url 'user_management' %}">
        <i class="fas fa-users-cog me-2"></i>User Management
      </a>
      <a href="{% url 'reports' %}">
        <i class="fas fa-chart-line me-2"></i>Reports
      </a>
    {% endif %}

    <!-- Logout -->
    <a href="{{ url 'logout' }}" class="text-danger">
      <i class="fas fa-sign-out-alt me-2"></i>Logout
    </a>
  </nav>
</div>


  <!-- Main Content -->
  <div class="main-content">
    {% block content %}
    <!-- Page-specific content will appear here -->
    {% endblock %}
  </div>

</body>
</html>
